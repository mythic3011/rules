    policyReference: internal/config/ai-routing/mihomo.yaml#profiles.hk
  dns:
    surface: dns
    operation: add-map-entry
    map: nameserver-policy
    key: rule-set:AI_Claude_Classical
    value: ["https://1.1.1.1/dns-query#🔐 Claude Account Guard"]
    reason: "Claude DNS is unavailable unless the same explicit account selector is armed."
    policyReference: internal/config/ai-routing/20-protection-classes.yaml
