    add:
      - "RULE-SET,AI_Claude_Classical,🔐 Claude Account Guard"
      - "RULE-SET,AI_Claude_Classical,REJECT"
      - "RULE-SET,AI_ChatGPT_Classical,🤖 ChatGPT"
      - "RULE-SET,AI_Copilot_Classical,🧑‍💻 Copilot"
      - "RULE-SET,AI_Gemini_Classical,🤖 Gemini"
      - "RULE-SET,AI_Grok_Classical,🤖 Grok"
      - "RULE-SET,AI_HuggingFace_Classical,🤗 Hugging Face"
      - "RULE-SET,AI_NotebookLM_Classical,🤖 NotebookLM"
      - "RULE-SET,AI_Perplexity_Classical,🤖 Perplexity"
      - "RULE-SET,AI_Poe_Classical,🤖 Poe"
      - "RULE-SET,AI_Windsurf_Classical,🌊 Windsurf"
      - "RULE-SET,AI_All_Classical,DIRECT"
      - "GEOSITE,google-deepmind,DIRECT"
      - "GEOSITE,category-ai-!cn,DIRECT"
