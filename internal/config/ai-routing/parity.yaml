      - "RULE-SET,AI_Stitch_Classical,🤖 Stitch"
      - "RULE-SET,AI_AndroidStudioAI_Classical,🤖 Android Studio AI"
      - "RULE-SET,AI_GeminiCloud_Classical,🤖 Gemini Cloud"
      - "RULE-SET,AI_VertexAI_Classical,🤖 Vertex AI"
      - "GEOSITE,google-deepmind,🤖 AI Other"
      - "GEOSITE,category-ai-!cn,🤖 AI Other"
      - "GEOSITE,category-ai-cn,🤖 AI CN Other"
