schemaVersion: 1
upstreamSourceManifest: ../sources/upstream-sources.json
sources:
  vpsdance:
    manifestSource: vpsdance
  local-rules:
    label: mythic3011 generated AI rules
    repository: mythic3011/rules
    revision: 0e9631339904f4a989c884781570b5756d82c9a3
    rawBaseUrl: https://raw.githubusercontent.com/mythic3011/rules
proxyProviders:
  provider1:
    external: true
pinnedEgressBindings:
  claude-us-pinned:
    US-Claude-01: provider1
    US-Claude-02: provider1
regions:
  us:
    autoGroup: "🇺🇸 US Auto"
    stableGroup: "🇺🇸 US Stable"
    use: [provider1]
    filter: "(?i)🇺🇸|美國|美国|波特蘭|波特兰|達拉斯|达拉斯|俄勒岡|俄勒冈|鳳凰城|凤凰城|費利蒙|费利蒙|硅谷|拉斯維加斯|拉斯维加斯|洛杉磯|洛杉矶|聖何塞|圣何塞|聖克拉拉|圣克拉拉|西雅圖|西雅图|芝加哥|紐約|纽约|亞特蘭大|亚特兰大|邁阿密|迈阿密|華盛頓|华盛顿|\\bUS(?:[-_ ]?\\d+(?:[-_ ]?[A-Za-z]{2,})?)?\\b|United States|UnitedStates|\\bUSA\\b|America|JFK|EWR|IAD|ATL|ORD|MIA|NYC|LAX|SFO|SEA|DFW|SJC"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80
  sg:
    autoGroup: "🇸🇬 SG Auto"
    stableGroup: "🇸🇬 SG Stable"
    use: [provider1]
    filter: "(?i)🇸🇬|新加坡|獅城|狮城|\\bSG(?:[-_ ]?\\d+(?:[-_ ]?[A-Za-z]{2,})?)?\\b|Singapore|SIN"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80
  jp:
    autoGroup: "🇯🇵 JP Auto"
    stableGroup: "🇯🇵 JP Stable"
    use: [provider1]
    filter: "(?i)🇯🇵|日本|東京|东京|大阪|關西|关西|埼玉|川日|泉日|滬日|沪日|深日|\\bJP(?:[-_ ]?\\d+(?:[-_ ]?[A-Za-z]{2,})?)?\\b|Japan|JPN|NRT|HND|KIX|TYO|OSA|Kansai"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80
ruleProviders:
  AI_ChatGPT_Classical:
    type: http
    behavior: classical
    format: yaml
    interval: 10800
    source: vpsdance
    path: rules/clash/openai.yaml
  AI_Copilot_Classical:
    type: http
    behavior: classical
    format: yaml
    interval: 10800
    source: vpsdance
    path: rules/clash/copilot.yaml
  AI_Claude_Classical:
    type: http
    behavior: classical
    format: yaml
    interval: 10800
    source: vpsdance
    path: rules/clash/anthropic.yaml
  AI_Gemini_Classical:
    type: http
    behavior: classical
    format: yaml
    interval: 10800
    source: local-rules
    path: rule/AI_Gemini_Classical.yaml
  AI_NotebookLM_Classical:
    type: http
    behavior: classical
    format: yaml
    interval: 10800
    source: local-rules
    path: rule/AI_NotebookLM_Classical.yaml
  AI_Perplexity_Classical:
    type: http
    behavior: classical
    format: yaml
    interval: 10800
    source: vpsdance
    path: rules/clash/perplexity.yaml
  AI_Grok_Classical:
    type: http
    behavior: classical
    format: yaml
    interval: 10800
    source: vpsdance
    path: rules/clash/x-ai.yaml
  AI_Poe_Classical:
    type: http
    behavior: classical
    format: yaml
    interval: 10800
    source: vpsdance
    path: rules/clash/poe.yaml
  AI_Windsurf_Classical:
    type: http
    behavior: classical
    format: yaml
    interval: 10800
    source: vpsdance
    path: rules/clash/windsurf.yaml
  AI_HuggingFace_Classical:
    type: http
    behavior: classical
    format: yaml
    interval: 10800
    source: vpsdance
    path: rules/clash/huggingface.yaml
  Flow_Music_Classical:
    type: http
    behavior: classical
    format: yaml
    interval: 10800
    source: local-rules
    path: rule/Flow_Music_Classical.yaml
  AI_All_Classical:
    type: http
    behavior: classical
    format: yaml
    interval: 10800
    source: vpsdance
    path: rules/clash/all.yaml
profiles:
  hk:
    aiAllRoute: direct
    categoryAiRoute: direct
  us:
    aiAllRoute: us-stable
    categoryAiRoute: us-stable
  sg:
    aiAllRoute: sg-stable
    categoryAiRoute: sg-stable
  jp:
    aiAllRoute: jp-stable
    categoryAiRoute: jp-stable
modeControl:
  visibleGroup: "🌍 AI 存取模式"
  hiddenPrefix: "@mode/"
aiAllRuleset: AI_All_Classical
categoryGeosites: [google-deepmind, category-ai-!cn]
iniMvp:
  profile: hk
  migratedServices: [claude, windsurf, huggingface]
  legacyReplacementIds: [claude]
  aiOtherGroup: "🤖 AI Other"
  aiOtherAllowedRoutes: [direct, us-stable, sg-stable, jp-stable, reject]
  presentation:
    rejectGroup: "⛔ 拒絕"
    directGroup: "🎯 全球直連"
