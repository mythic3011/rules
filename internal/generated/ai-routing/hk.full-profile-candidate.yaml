proxy-groups:
  - name: 🚀 手動選擇
    type: select
    proxies:
      - ♻️ 自動選擇
      - 🎯 全球直連
      - 🇺🇸 美國節點
      - 🇯🇵 日本節點
      - 🇸🇬 新加坡節點
      - 🇹🇼 台灣節點
      - 🇰🇷 韓國節點
      - 🌐 其他／未識別節點
      - ⛔ 拒絕
    filter: "(?i)^(?!.*(?:🇭🇰|香港|Hong
      Kong|Hong-Kong|\bHKG\b|\bHK\b|剩余流量|剩餘流量|套餐到期|到期|流量[:：]|Traffic|Expire|Subsc\
      ription|官网|官方|客服|Telegram|TG群|网址|網站|更新|失效|Invalid|USE|USED|TOTAL|EXPIRE|Pan\
      el|Channel|Author|公告|通知|邀请|邀請|返利|教程|使用说明|使用說明)).*$"
    use:
      - provider1
  - name: ♻️ 自動選擇
    type: url-test
    filter: "(?i)^(?!.*(?:🇭🇰|香港|Hong
      Kong|Hong-Kong|\bHKG\b|\bHK\b|剩余流量|剩餘流量|套餐到期|到期|流量[:：]|Traffic|Expire|Subsc\
      ription|官网|官方|客服|Telegram|TG群|网址|網站|更新|失效|Invalid|USE|USED|TOTAL|EXPIRE|Pan\
      el|Channel|Author|公告|通知|邀请|邀請|返利|教程|使用说明|使用說明)).*$"
    tolerance: 50
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    use:
      - provider1
  - name: 💳 穩定會話
    type: select
    proxies:
      - DIRECT
      - REJECT
    use:
      - provider1
  - name: 🔐 高風險帳戶
    type: select
    proxies:
      - REJECT
      - 💳 穩定會話
    default-selected: REJECT
  - name: ⛔ 拒絕
    type: select
    proxies:
      - REJECT
  - name: 🐟 漏網之魚
