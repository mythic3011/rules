schemaVersion: 1
policyVersion: "1"
routeTargets:
  reject: { kind: reject, group: REJECT }
protectionClasses: {}
services:
  windsurf:
    displayName: Windsurf
    protectionClass: missing-class
    defaultRoute: missing-route
    allowedRoutes: [missing-route]
    selector:
      kind: profile-aware
      visibleGroup: Windsurf
      hiddenProfileTarget: "@profile/windsurf"
      allowedRouteRefs: [missing-route]
    upstream: { source: vpsdance, provider: windsurf }
    endpoints: {}
accessProfiles: {}
dns:
  defaultProfile: default
  profiles:
    default:
      respectRules: false
      defaultNameserver: [{ kind: udp, host: 1.1.1.1 }]
      proxyServerNameserver: []
      nameserver: [{ kind: udp, host: 1.1.1.1 }]
      servicePolicies: {}
