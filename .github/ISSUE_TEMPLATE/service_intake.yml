# GENERATED by internal/python/generate_service_intake_form.py. Do not edit by hand.
name: "🌍 Regional service intake"
description: Report service matchers and observed regional availability; automation proposes the registry change.
title: "[Service Intake]: "
labels: ["service-intake"]
body:
  - type: markdown
    attributes:
      value: |
        Submit observed facts. You do not need to know the routing implementation.
        Generated cfg/rule files are never edited from this form.
        If a region is missing, use the Additional / unlisted regions section below.
  - type: input
    id: service_name
    attributes:
      label: Service name
      placeholder: Example AI
    validations: {required: true}
  - type: input
    id: service_id
    attributes:
      label: Service ID (optional)
      description: Lowercase slug. Leave blank to derive it from the service name.
  - type: dropdown
    id: matcher_type
    attributes:
      label: Matcher type
      options:
        - "DOMAIN-SUFFIX"
        - "DOMAIN"
        - "DOMAIN-KEYWORD"
        - "IP-CIDR"
        - "PROCESS-NAME"
        - "PROCESS-PATH"
    validations: {required: true}
  - type: textarea
    id: matcher_values
    attributes:
      label: Matcher values
      description: One value per line. Do not include matcher prefixes.
      placeholder: |
        example.com
        api.example.com
    validations: {required: true}
  - type: dropdown
    id: working_regions
    attributes:
      label: Confirmed working regions
      multiple: true
      options:
        - "us — United States"
        - "jp — Japan"
        - "sg — Singapore"
        - "tw — Taiwan"
        - "kr — South Korea"
        - "hk — Hong Kong"
        - "mo — Macao"
        - "uk — United Kingdom"
        - "fr — France"
        - "de — Germany"
        - "it — Italy"
        - "no — Norway"
        - "ca — Canada"
        - "au — Australia"
        - "ru — Russia"
        - "ua — Ukraine"
        - "tr — Turkey"
    validations: {required: true}
  - type: dropdown
    id: blocked_regions
    attributes:
      label: Confirmed blocked regions
      multiple: true
      options:
        - "us — United States"
        - "jp — Japan"
        - "sg — Singapore"
        - "tw — Taiwan"
        - "kr — South Korea"
        - "hk — Hong Kong"
        - "mo — Macao"
        - "uk — United Kingdom"
        - "fr — France"
        - "de — Germany"
        - "it — Italy"
        - "no — Norway"
        - "ca — Canada"
        - "au — Australia"
        - "ru — Russia"
        - "ua — Ukraine"
        - "tr — Turkey"
  - type: checkboxes
    id: add_unlisted_regions
    attributes:
      label: Other / new region
      description: Tick this if one or more relevant regions are not listed above, then fill the slots below.
      options:
        - label: I need to add one or more unlisted regions.
  - type: markdown
    attributes:
      value: |
        ### Additional / unlisted regions
        You can add up to three regions in the same ticket. The canonical region ID, flag, group name and regex are generated automatically.
        Use the code field for short codes such as `IS`; do not repeat two-letter codes as loose node keywords.
  - type: dropdown
    id: additional_region_1_status
    attributes:
      label: Additional region 1 status
      options: ["Not used", "Works", "Blocked"]
  - type: input
    id: additional_region_1_code
    attributes:
      label: Additional region 1 code
      description: 2-3 letter country/region code. The canonical ID is derived from this value.
      placeholder: IS
  - type: input
    id: additional_region_1_name
    attributes:
      label: Additional region 1 name
      placeholder: Iceland
  - type: textarea
    id: additional_region_1_aliases
    attributes:
      label: Additional region 1 aliases
      description: Optional human names, one per line. The primary name is added automatically.
      placeholder: |
        Ísland
  - type: textarea
    id: additional_region_1_keywords
    attributes:
      label: Additional region 1 node keywords
      description: Optional provider-node city/airport/emoji terms, one per line.
      placeholder: |
        Reykjavik
        KEF
        🇮🇸
  - type: dropdown
    id: additional_region_1_routable
    attributes:
      label: Additional region 1 routing exit
      description: Yes means provider nodes from this newly created region may be selected as exits.
      options: ["No — observation only", "Yes — add as routing exit"]
  - type: dropdown
    id: additional_region_2_status
    attributes:
      label: Additional region 2 status
      options: ["Not used", "Works", "Blocked"]
  - type: input
    id: additional_region_2_code
    attributes:
      label: Additional region 2 code
      description: 2-3 letter country/region code. The canonical ID is derived from this value.
      placeholder: IS
  - type: input
    id: additional_region_2_name
    attributes:
      label: Additional region 2 name
      placeholder: Iceland
  - type: textarea
    id: additional_region_2_aliases
    attributes:
      label: Additional region 2 aliases
      description: Optional human names, one per line. The primary name is added automatically.
      placeholder: |
        Ísland
  - type: textarea
    id: additional_region_2_keywords
    attributes:
      label: Additional region 2 node keywords
      description: Optional provider-node city/airport/emoji terms, one per line.
      placeholder: |
        Reykjavik
        KEF
        🇮🇸
  - type: dropdown
    id: additional_region_2_routable
    attributes:
      label: Additional region 2 routing exit
      description: Yes means provider nodes from this newly created region may be selected as exits.
      options: ["No — observation only", "Yes — add as routing exit"]
  - type: dropdown
    id: additional_region_3_status
    attributes:
      label: Additional region 3 status
      options: ["Not used", "Works", "Blocked"]
  - type: input
    id: additional_region_3_code
    attributes:
      label: Additional region 3 code
      description: 2-3 letter country/region code. The canonical ID is derived from this value.
      placeholder: IS
  - type: input
    id: additional_region_3_name
    attributes:
      label: Additional region 3 name
      placeholder: Iceland
  - type: textarea
    id: additional_region_3_aliases
    attributes:
      label: Additional region 3 aliases
      description: Optional human names, one per line. The primary name is added automatically.
      placeholder: |
        Ísland
  - type: textarea
    id: additional_region_3_keywords
    attributes:
      label: Additional region 3 node keywords
      description: Optional provider-node city/airport/emoji terms, one per line.
      placeholder: |
        Reykjavik
        KEF
        🇮🇸
  - type: dropdown
    id: additional_region_3_routable
    attributes:
      label: Additional region 3 routing exit
      description: Yes means provider nodes from this newly created region may be selected as exits.
      options: ["No — observation only", "Yes — add as routing exit"]
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I am reporting observed service reachability, not requesting arbitrary code execution.
          required: true
