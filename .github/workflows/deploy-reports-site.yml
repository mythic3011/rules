name: Deploy reports site

on:
  push:
    branches: ["main"]
    paths:
      - "web/site/**"
      - "web/reports/**"
      - "catalog.json"
      - "dns/**"
      - "rule/**"
      - "internal/python/generate_adblock_outputs.py"
      - "docs/guides/openclash/RULE_ASSET_MATCHING_CONTRACT.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise.toml"
      - ".github/workflows/deploy-reports-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: false

      - name: Install pinned toolchain
        run: mise install

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend site
        run: pnpm run web:build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build static site payload
        run: |
          rm -rf _site
          mkdir -p _site/reports _site/dns _site/rule
          cp -R dist/site/. _site/
          cp -R web/reports/. _site/reports/
          cp -R dns/. _site/dns/
          cp -R rule/. _site/rule/
          cp catalog.json _site/catalog.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
