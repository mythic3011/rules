name: Auto generate AI profiles
on:
  push:
    paths:
      - "internal/python/generate_ai_profiles.py"
      - "internal/python/generate_profile_service_runtime.py"
      - "apps/profile-service/**"
      - "internal/python/ai_profiles/**"
      - "internal/python/local_profile_compose.py"
      - "internal/python/validate_generated_profiles.py"
      - "internal/typescript/routing/**"
      - "internal/config/ai-routing/**"
      - "internal/templates/ai-routing/**"
      - "internal/generated/ai-routing/**"
      - "internal/examples/ai-routing/**"
      - "setup/openclash/scripts/ai-routing-controller.sh"
      - "tests/routing/**"
      - "tests/fixtures/routing/**"
      - "tests/test_*.py"
      - "internal/schemas/routing-config.schema.json"
      - "docs/ai-routing-schema-foundation.md"
      - "docs/ai-routing-firewall-proof.md"
      - "docs/ai-profile-generator.md"
      - "docs/kill-switch.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise.toml"
      - "Makefile"
      - "internal/config/rulesctl.json"
      - "internal/python/rulesctl.py"
      - "requirements*.txt"
      - "tsconfig.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "internal/python/generate_ai_profiles.py"
      - "internal/python/generate_profile_service_runtime.py"
      - "apps/profile-service/**"
      - "internal/python/ai_profiles/**"
      - "internal/python/local_profile_compose.py"
      - "internal/python/validate_generated_profiles.py"
      - "internal/typescript/routing/**"
      - "internal/config/ai-routing/**"
      - "internal/templates/ai-routing/**"
      - "internal/generated/ai-routing/**"
      - "internal/examples/ai-routing/**"
      - "setup/openclash/scripts/ai-routing-controller.sh"
      - "tests/routing/**"
      - "tests/fixtures/routing/**"
      - "tests/test_*.py"
      - "internal/schemas/routing-config.schema.json"
      - "docs/ai-routing-schema-foundation.md"
      - "docs/ai-routing-firewall-proof.md"
      - "docs/ai-profile-generator.md"
      - "docs/kill-switch.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise.toml"
      - "Makefile"
      - "internal/config/rulesctl.json"
      - "internal/python/rulesctl.py"
      - "requirements*.txt"
      - "tsconfig.json"
      - ".github/workflows/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ai-profiles:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          install: false

      - name: Install pinned toolchain
        run: mise install

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Refresh shared upstream source lock on schedule
        if: github.event_name == 'schedule'
        run: python3 internal/python/generate_ai_profiles.py --refresh-upstream-sources

      - name: Validate AI routing manifests
        run: |
          make ci

      - name: Refresh upstream AI host snapshot on schedule
        if: github.event_name == 'schedule'
        run: python3 internal/python/generate_ai_profiles.py --refresh-upstream-hosts

      - name: Generate repository outputs
        run: make generate

      - name: Validate generated outputs
        run: python3 internal/python/validate_generated_profiles.py

      - name: Reject generated output drift in pull requests
        if: github.event_name == 'pull_request'
        run: |
          mapfile -t managed_paths < <(./rulesctl managed-paths)
          managed_status="$(git status --porcelain -- "${managed_paths[@]}")"
          if [ -n "$managed_status" ]; then
            echo "Generator changed managed AI outputs in this pull request:"
            echo "$managed_status"
            exit 1
          fi

      - name: Check profile service packaging
        run: mise run deploy:check

      - name: Install Chromium for profile service E2E
        run: pnpm --filter mythic-rules-profile-service exec playwright install --with-deps chromium

      - name: Test profile service in Chromium
        timeout-minutes: 5
        env:
          PROFILE_SERVICE_E2E_BASE_URL: http://127.0.0.1:8787
        run: |
          server_log="$RUNNER_TEMP/profile-service-dev.log"
          server_port="$(node -p 'new URL(process.env.PROFILE_SERVICE_E2E_BASE_URL).port')"
          mise run dev --ip 127.0.0.1 --port "$server_port" --log-level error --show-interactive-dev-session=false >"$server_log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in {1..40}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Local profile service exited before becoming ready." >&2
              cat "$server_log"
              exit 1
            fi
            if curl --fail --silent --connect-timeout 1 --max-time 2 --output /dev/null "${PROFILE_SERVICE_E2E_BASE_URL}/api/v1/catalog"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Local profile service did not become ready." >&2
            cat "$server_log"
            exit 1
          fi
          mise run e2e

  commit-managed-python-outputs:
    # PR code is validated with a read-only token above. Only trusted push/schedule
    # events may reach this separate write-capable job.
    if: github.event_name == 'push' || github.event_name == 'schedule'
    needs: validate-ai-profiles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TARGET_REF: ${{ github.ref }}

    steps:
      - name: Checkout pushed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          install: false

      - name: Install pinned toolchain
        run: mise install

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Refresh shared upstream source lock on schedule
        if: github.event_name == 'schedule'
        run: python3 internal/python/generate_ai_profiles.py --refresh-upstream-sources

      - name: Refresh upstream AI host snapshot on schedule
        if: github.event_name == 'schedule'
        run: python3 internal/python/generate_ai_profiles.py --refresh-upstream-hosts

      - name: Regenerate repository outputs
        run: make generate

      - name: Test profile service solver
        run: pnpm run test:profile-service

      - name: Audit generated upstream ownership
        run: python3 internal/python/generate_ai_profiles.py --audit-rule-coverage

      - name: Commit generated changes
        run: |
          case "$TARGET_REF" in
            refs/heads/*) ;;
            *) echo "Refusing to push a non-branch ref: $TARGET_REF" >&2; exit 1 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mapfile -t managed_paths < <(./rulesctl managed-paths)
          git add -A -- "${managed_paths[@]}"
          if ! git diff --cached --quiet; then
            git commit -m "chore(ai): auto generate AI profiles"
            git push origin "HEAD:${TARGET_REF}"
          else
            echo "No generated changes."
          fi
