name: Auto generate AI profiles
on:
  push:
    paths:
      - "internal/python/generate_ai_profiles.py"
      - "internal/python/generate_profile_service_runtime.py"
      - "apps/profile-service/**"
      - "internal/python/ai_profiles/**"
      - "internal/python/local_profile_compose.py"
      - "internal/python/validate_generated_profiles.py"
      - "internal/typescript/routing/**"
      - "internal/config/ai-routing/**"
      - "internal/templates/ai-routing/**"
      - "internal/generated/ai-routing/**"
      - "internal/examples/ai-routing/**"
      - "setup/openclash/scripts/ai-routing-controller.sh"
      - "tests/routing/**"
      - "tests/fixtures/routing/**"
      - "tests/test_*.py"
      - "internal/schemas/routing-config.schema.json"
      - "docs/ai-routing-schema-foundation.md"
      - "docs/ai-routing-firewall-proof.md"
      - "docs/ai-profile-generator.md"
      - "docs/kill-switch.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/auto-generate-ai-profiles.yml"
  pull_request:
    paths:
      - "internal/python/generate_ai_profiles.py"
      - "internal/python/generate_profile_service_runtime.py"
      - "apps/profile-service/**"
      - "internal/python/ai_profiles/**"
      - "internal/python/local_profile_compose.py"
      - "internal/python/validate_generated_profiles.py"
      - "internal/typescript/routing/**"
      - "internal/config/ai-routing/**"
      - "internal/templates/ai-routing/**"
      - "internal/generated/ai-routing/**"
      - "internal/examples/ai-routing/**"
      - "setup/openclash/scripts/ai-routing-controller.sh"
      - "tests/routing/**"
      - "tests/fixtures/routing/**"
      - "tests/test_*.py"
      - "internal/schemas/routing-config.schema.json"
      - "docs/ai-routing-schema-foundation.md"
      - "docs/ai-routing-firewall-proof.md"
      - "docs/ai-profile-generator.md"
      - "docs/kill-switch.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/auto-generate-ai-profiles.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ai-profiles:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Refresh shared upstream source lock on schedule
        if: github.event_name == 'schedule'
        run: |
          python3 internal/python/generate_ai_profiles.py --refresh-upstream-sources
          npm run export:routing-artifacts
          npm run export:shadow-profile

      - name: Validate AI routing manifests
        run: |
          make ci

      - name: Refresh upstream AI host snapshot on schedule
        if: github.event_name == 'schedule'
        run: python3 internal/python/generate_ai_profiles.py --refresh-upstream-hosts

      - name: Generate AI profile outputs
        run: python3 internal/python/generate_ai_profiles.py

      - name: Validate generated outputs
        run: python3 internal/python/validate_generated_profiles.py

      - name: Reject generated output drift in pull requests
        if: github.event_name == 'pull_request'
        run: |
          mapfile -t managed_paths < <(./rulesctl managed-paths)
          managed_status="$(git status --porcelain -- "${managed_paths[@]}")"
          if [ -n "$managed_status" ]; then
            echo "Generator changed managed AI outputs in this pull request:"
            echo "$managed_status"
            exit 1
          fi
          git diff --exit-code -- apps/profile-service/worker/generated/runtime-data.mjs

  commit-managed-python-outputs:
    # PR code is validated with a read-only token above. Only trusted push/schedule
    # events may reach this separate write-capable job.
    if: github.event_name == 'push' || github.event_name == 'schedule'
    needs: validate-ai-profiles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TARGET_REF: ${{ github.ref }}

    steps:
      - name: Checkout pushed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Refresh shared upstream source lock on schedule
        if: github.event_name == 'schedule'
        run: |
          python3 internal/python/generate_ai_profiles.py --refresh-upstream-sources
          npm run export:routing-artifacts

      - name: Refresh upstream AI host snapshot on schedule
        if: github.event_name == 'schedule'
        run: python3 internal/python/generate_ai_profiles.py --refresh-upstream-hosts

      - name: Regenerate managed Python outputs
        run: python3 internal/python/generate_ai_profiles.py

      - name: Regenerate shadow profile on schedule
        if: github.event_name == 'schedule'
        run: npm run export:shadow-profile

      - name: Regenerate profile service runtime
        run: python3 internal/python/generate_profile_service_runtime.py

      - name: Test profile service solver
        run: npm run test:profile-service

      - name: Audit generated upstream ownership
        run: python3 internal/python/generate_ai_profiles.py --audit-rule-coverage

      - name: Commit generated changes
        run: |
          case "$TARGET_REF" in
            refs/heads/*) ;;
            *) echo "Refusing to push a non-branch ref: $TARGET_REF" >&2; exit 1 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mapfile -t managed_paths < <(./rulesctl managed-paths)
          git add -A -- "${managed_paths[@]}"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            git add -A -- "${managed_paths[@]}"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(ai): auto generate AI profiles"
            git push origin "HEAD:${TARGET_REF}"
          else
            echo "No generated changes."
          fi
