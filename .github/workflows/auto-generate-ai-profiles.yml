name: Auto generate AI profiles
on:
  push:
    paths:
      - "internal/python/generate_ai_profiles.py"
      - "internal/python/generate_profile_service_runtime.py"
      - "internal/python/generate_openclash_guard_release.py"
      - "internal/python/generate_openclash_guard_runtime.py"
      - "internal/python/generate_openclash_guard_resolver_sync_rules.py"
      - "apps/profile-service/**"
      - "internal/python/ai_profiles/**"
      - "internal/python/local_profile_compose.py"
      - "internal/python/validate_generated_profiles.py"
      - "internal/typescript/routing/**"
      - "internal/config/ai-routing/**"
      - "internal/config/openclash-guard/**"
      - "internal/templates/ai-routing/**"
      - "internal/generated/ai-routing/**"
      - "internal/examples/ai-routing/**"
      - "setup/openclash/install.sh"
      - "setup/openclash/openclash-guard-resolver-sync"
      - "setup/openclash/scripts/ai-routing-controller.sh"
      - "cfg/runtime/openclash-guard-resolver-sync.rules"
      - "shell/**"
      - "dist/openclash-guard.release.json"
      - "tests/routing/**"
      - "tests/fixtures/routing/**"
      - "tests/test_*.py"
      - "internal/schemas/routing-config.schema.json"
      - "docs/ai-routing-schema-foundation.md"
      - "docs/ai-routing-firewall-proof.md"
      - "docs/ai-profile-generator.md"
      - "docs/kill-switch.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/auto-generate-ai-profiles.yml"
  pull_request:
    paths:
      - "internal/python/generate_ai_profiles.py"
      - "internal/python/generate_profile_service_runtime.py"
      - "internal/python/generate_openclash_guard_release.py"
      - "internal/python/generate_openclash_guard_runtime.py"
      - "internal/python/generate_openclash_guard_resolver_sync_rules.py"
      - "apps/profile-service/**"
      - "internal/python/ai_profiles/**"
      - "internal/python/local_profile_compose.py"
      - "internal/python/validate_generated_profiles.py"
      - "internal/typescript/routing/**"
      - "internal/config/ai-routing/**"
      - "internal/config/openclash-guard/**"
      - "internal/templates/ai-routing/**"
      - "internal/generated/ai-routing/**"
      - "internal/examples/ai-routing/**"
      - "setup/openclash/install.sh"
      - "setup/openclash/openclash-guard-resolver-sync"
      - "setup/openclash/scripts/ai-routing-controller.sh"
      - "cfg/runtime/openclash-guard-resolver-sync.rules"
      - "shell/**"
      - "dist/openclash-guard.release.json"
      - "tests/routing/**"
      - "tests/fixtures/routing/**"
      - "tests/test_*.py"
      - "internal/schemas/routing-config.schema.json"
      - "docs/ai-routing-schema-foundation.md"
      - "docs/ai-routing-firewall-proof.md"
      - "docs/ai-profile-generator.md"
      - "docs/kill-switch.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/auto-generate-ai-profiles.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ai-profiles:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Refresh shared upstream source lock on schedule
        if: github.event_name == 'schedule'
        run: uv run python internal/python/generate_ai_profiles.py --refresh-upstream-sources

      - name: Refresh upstream AI host snapshot on schedule
        if: github.event_name == 'schedule'
        run: uv run python internal/python/generate_ai_profiles.py --refresh-upstream-hosts

      - name: Generate repository outputs
        run: make generate

      - name: Validate generated outputs
        run: uv run python internal/python/validate_generated_profiles.py

      - name: Validate source tree and generated contracts
        run: make check-all

      - name: Reject generated output drift in pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mapfile -t managed_paths < <(./rulesctl managed-paths)
          managed_status="$(git status --porcelain -- "${managed_paths[@]}")"
          if [ -n "$managed_status" ]; then
            echo "Generator changed managed outputs in this pull request:"
            echo "$managed_status"
            echo "Trusted push/schedule runs repair and commit these outputs automatically."
            exit 1
          fi

  commit-managed-python-outputs:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    needs: validate-ai-profiles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Refresh shared upstream source lock on schedule
        if: github.event_name == 'schedule'
        run: uv run python internal/python/generate_ai_profiles.py --refresh-upstream-sources

      - name: Refresh upstream AI host snapshot on schedule
        if: github.event_name == 'schedule'
        run: uv run python internal/python/generate_ai_profiles.py --refresh-upstream-hosts

      - name: Regenerate managed outputs
        run: make generate

      - name: Validate profile service
        run: npm test --prefix apps/profile-service

      - name: Audit managed output coverage
        run: ./rulesctl audit-generated --diff-base HEAD

      - name: Commit generated changes
        shell: bash
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          mapfile -t managed_paths < <(./rulesctl managed-paths)
          git add -- "${managed_paths[@]}"
          if git diff --cached --quiet; then
            echo "No managed output changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ai): auto generate AI profiles"
          git push origin HEAD:"$TARGET_REF"
