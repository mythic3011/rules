name: Auto generate AI profiles

on:
  push:
    paths:
      - "py/generate_ai_profiles.py"
      - "py/local_profile_compose.py"
      - "py/validate_generated_profiles.py"
      - "src/routing/**"
      - "data/ai-routing/**"
      - "data/ai-routing-mihomo.yaml"
      - "data/ai-routing-parity.yaml"
      - "templates/ai-routing/**"
      - "generated/ai-routing/**"
      - "examples/ai-routing/**"
      - "shell/ai-routing-controller.sh"
      - "tests/routing/**"
      - "tests/fixtures/routing/**"
      - "tests/test_*.py"
      - "schema/routing-config.schema.json"
      - "docs/ai-routing-schema-foundation.md"
      - "docs/ai-profile-generator.md"
      - "docs/kill-switch.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/auto-generate-ai-profiles.yml"
  pull_request:
    paths:
      - "py/generate_ai_profiles.py"
      - "py/local_profile_compose.py"
      - "py/validate_generated_profiles.py"
      - "src/routing/**"
      - "data/ai-routing/**"
      - "data/ai-routing-mihomo.yaml"
      - "data/ai-routing-parity.yaml"
      - "templates/ai-routing/**"
      - "generated/ai-routing/**"
      - "examples/ai-routing/**"
      - "shell/ai-routing-controller.sh"
      - "tests/routing/**"
      - "tests/fixtures/routing/**"
      - "tests/test_*.py"
      - "schema/routing-config.schema.json"
      - "docs/ai-routing-schema-foundation.md"
      - "docs/ai-profile-generator.md"
      - "docs/kill-switch.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/auto-generate-ai-profiles.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ai-profiles:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Validate AI routing manifests
        run: |
          npm ci
          npm run validate:routing
          npm run test:routing
          npm run typecheck
          npm run check:routing-schema
          npm run check:routing-artifacts
          npm run check:shadow-profile

      - name: Generate AI profile outputs
        run: python3 py/generate_ai_profiles.py

      - name: Validate generated profile outputs
        run: |
          uv run --with pyyaml python3 -m unittest discover -s tests -p 'test_*.py'
          uv run --with pyyaml python3 py/validate_generated_profiles.py

      - name: Reject generated output drift in pull requests
        if: github.event_name == 'pull_request'
        run: |
          managed_status="$(git status --porcelain -- \
            cfg/Custom_Clash_AI.ini \
            cfg/yaml/Custom_Clash_AI.yaml \
            cfg/yaml/Custom_Clash_AI_Strict.yaml \
            ':(glob)rule/AI_*_Classical.yaml')"
          if [ -n "$managed_status" ]; then
            echo "Generator changed managed AI outputs in this pull request:"
            echo "$managed_status"
            exit 1
          fi

  commit-managed-python-outputs:
    # PR code is validated with a read-only token above. Only a trusted push
    # may reach this separate write-capable job.
    if: github.event_name == 'push'
    needs: validate-ai-profiles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TARGET_REF: ${{ github.ref }}

    steps:
      - name: Checkout pushed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Regenerate managed Python outputs
        run: python3 py/generate_ai_profiles.py

      - name: Commit generated changes
        run: |
          case "$TARGET_REF" in
            refs/heads/*) ;;
            *) echo "Refusing to push a non-branch ref: $TARGET_REF" >&2; exit 1 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            cfg/Custom_Clash_AI.ini \
            cfg/yaml/Custom_Clash_AI.yaml \
            cfg/yaml/Custom_Clash_AI_Strict.yaml \
            ':(glob)rule/AI_*_Classical.yaml'

          if ! git diff --cached --quiet; then
            git commit -m "chore(ai): auto generate AI profiles"
            git push origin "HEAD:${TARGET_REF}"
          else
            echo "No generated changes."
          fi
