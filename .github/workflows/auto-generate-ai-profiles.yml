name: Auto generate AI profiles
on:
  push:
    branches: ["**"]
  pull_request:
    paths:
      - "internal/python/generate_ai_profiles.py"
      - "internal/python/generate_profile_service_runtime.py"
      - "internal/python/generate_openclash_guard_release.py"
      - "internal/python/generate_openclash_guard_runtime.py"
      - "apps/profile-service/**"
      - "internal/python/ai_profiles/**"
      - "internal/python/local_profile_compose.py"
      - "internal/python/validate_generated_profiles.py"
      - "internal/typescript/routing/**"
      - "internal/config/ai-routing/**"
      - "internal/templates/ai-routing/**"
      - "internal/generated/ai-routing/**"
      - "internal/examples/ai-routing/**"
      - "setup/openclash/install.sh"
      - "setup/openclash/scripts/ai-routing-controller.sh"
      - "shell/**"
      - "dist/openclash-guard.release.json"
      - "tests/routing/**"
      - "tests/fixtures/routing/**"
      - "tests/test_*.py"
      - "internal/schemas/routing-config.schema.json"
      - "docs/ai-routing-schema-foundation.md"
      - "docs/ai-routing-firewall-proof.md"
      - "docs/ai-profile-generator.md"
      - "docs/kill-switch.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise.toml"
      - "Makefile"
      - "internal/config/rulesctl.json"
      - "internal/python/rulesctl.py"
      - "requirements*.txt"
      - "tsconfig.json"
      - ".github/workflows/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-generate-ai-profiles-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ai-profiles:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: false

      - name: Install pinned toolchain
        run: mise install

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Refresh shared upstream source lock on schedule
        if: github.event_name == 'schedule'
        run: python3 internal/python/generate_ai_profiles.py --refresh-upstream-sources

      - name: Refresh upstream AI host snapshot on schedule
        if: github.event_name == 'schedule'
        run: python3 internal/python/generate_ai_profiles.py --refresh-upstream-hosts

      # Repair deterministic outputs in the workspace before checks that require
      # generated files to be current. Trusted push/schedule runs commit the repair
      # in the write-capable job below; PR runs remain read-only.
      - name: Generate repository outputs
        run: make generate

      - name: Validate generated outputs
        run: python3 internal/python/validate_generated_profiles.py

      - name: Validate source tree and generated contracts
        run: make check-all

      - name: Reject generated output drift in pull requests
        if: github.event_name == 'pull_request'
        run: |
          mapfile -t managed_paths < <(./rulesctl managed-paths)
          managed_status="$(git status --porcelain -- "${managed_paths[@]}")"
          if [ -n "$managed_status" ]; then
            echo "Generator changed managed outputs in this pull request:"
            echo "$managed_status"
            echo "Trusted push/schedule runs repair and commit these outputs automatically."
            exit 1
          fi

      - name: Check profile service packaging
        run: mise run deploy:check

      - name: Install Chromium for profile service E2E
        run: pnpm --filter mythic-rules-profile-service exec playwright install --with-deps chromium

      - name: Test profile service in Chromium
        timeout-minutes: 5
        env:
          PROFILE_SERVICE_E2E_BASE_URL: http://127.0.0.1:8787
        run: |
          server_log="$RUNNER_TEMP/profile-service-dev.log"
          server_port="$(node -p 'new URL(process.env.PROFILE_SERVICE_E2E_BASE_URL).port')"
          mise run dev --ip 127.0.0.1 --port "$server_port" --log-level error --show-interactive-dev-session=false >"$server_log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in {1..40}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Local profile service exited before becoming ready." >&2
              cat "$server_log"
              exit 1
            fi
            if curl --fail --silent --connect-timeout 1 --max-time 2 --output /dev/null "${PROFILE_SERVICE_E2E_BASE_URL}/api/v1/catalog"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Local profile service did not become ready." >&2
            cat "$server_log"
            exit 1
          fi
          mise run e2e

  commit-managed-python-outputs:
    # PR code is validated with a read-only token above. Only trusted push/schedule
    # events may reach this separate write-capable job.
    if: github.event_name == 'push' || github.event_name == 'schedule'
    needs: validate-ai-profiles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TARGET_REF: ${{ github.ref }}

    steps:
      - name: Checkout validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: false

      - name: Install pinned toolchain
        run: mise install

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Refresh shared upstream source lock on schedule
        if: github.event_name == 'schedule'
        run: python3 internal/python/generate_ai_profiles.py --refresh-upstream-sources

      - name: Refresh upstream AI host snapshot on schedule
        if: github.event_name == 'schedule'
        run: python3 internal/python/generate_ai_profiles.py --refresh-upstream-hosts

      # Schedule inputs are refreshed independently from the read-only job, so
      # validate this writer's generated snapshot before auditing or pushing it.
      - name: Regenerate repository outputs
        run: make generate

      - name: Validate generated outputs before write
        run: python3 internal/python/validate_generated_profiles.py

      - name: Revalidate source tree before write
        run: make check-all

      - name: Audit generated upstream ownership
        run: python3 internal/python/generate_ai_profiles.py --audit-rule-coverage

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET_REF" in
            refs/heads/*) ;;
            *) echo "Refusing to push a non-branch ref: $TARGET_REF" >&2; exit 1 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mapfile -t managed_paths < <(./rulesctl managed-paths)
          git add -A -- "${managed_paths[@]}"
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "chore(generated): refresh managed outputs"
          if git push origin "HEAD:${TARGET_REF}"; then
            exit 0
          fi

          # Never execute or rewrite a newer revision in this write-capable job.
          # Every branch push has its own workflow run to repair the newer tip.
          git fetch --no-tags origin "$TARGET_REF"
          remote_tip=$(git rev-parse FETCH_HEAD)
          if [ "${{ github.event_name }}" = push ] && [ "$remote_tip" != "${{ github.sha }}" ]; then
            echo "Writer superseded by newer target $remote_tip; its push workflow will repair managed outputs."
            exit 0
          fi

          echo "Managed-output push failed without a superseding trusted push." >&2
          exit 1
