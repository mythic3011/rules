name: Deploy profile service

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-service-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: profile-service-production

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: false
          install: false

      - name: Install pinned toolchain
        run: mise install

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Validate checked-in sources and generated outputs
        run: mise run ci

      - name: Provision D1, migrate, and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the profile-service-production environment." >&2
            exit 1
          fi
          mise run deploy
