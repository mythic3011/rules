name: Temporary signed release trust candidate build

on:
  push:
    branches:
      - hardening/openclash-guard-signed-release
    paths:
      - .github/workflows/tmp-signed-release-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v6
        with:
          ref: hardening/openclash-guard-signed-release
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Wire authenticated release trust into Guard
        run: |
          python3 internal/python/tmp_patch_signed_release.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/test_distribution_manifest.py")
          text = path.read_text()
          text = text.replace(
              '        self.assertNotIn("| sh", readme)\n        self.assertNotIn("| sh", guide)\n',
              '        self.assertNotRegex(readme, r"curl[^\\n|]*\\|\\s*(?:/bin/)?sh(?:\\s|$)")\n        self.assertNotRegex(guide, r"curl[^\\n|]*\\|\\s*(?:/bin/)?sh(?:\\s|$)")\n',
              1,
          )
          path.write_text(text)

          path = Path("tests/test_openclash_guard.py")
          text = path.read_text()
          text = text.replace("import importlib.util\n", "import importlib.util\nimport hashlib\n", 1)

          anchor = "'''\n\n\ndef _write_exec(path: Path, content: str) -> None:\n"
          fake_usign = r'''\'\'\'

FAKE_USIGN = r\'\'\'#!/bin/sh
case "${1:-}" in
    -V) exit 0 ;;
    -F) printf '%s\\n' '0123456789abcdef0123456789abcdef' ; exit 0 ;;
    *) exit 2 ;;
esac
\'\'\'


def _write_exec(path: Path, content: str) -> None:
'''
          if anchor not in text:
              raise SystemExit("fake command insertion anchor not found")
          text = text.replace(anchor, fake_usign, 1)

          old = '''        _write_exec(self.bin / "nft", FAKE_NFT)
        _write_exec(self.bin / "curl", FAKE_CURL)
        self._write_uci({})
'''
          new = '''        _write_exec(self.bin / "nft", FAKE_NFT)
        _write_exec(self.bin / "curl", FAKE_CURL)
        _write_exec(self.bin / "usign", FAKE_USIGN)
        self.trusted_release_key = self.base / "trusted-release-key.pub"
        self.trusted_release_key.write_text("test release public key\\n", encoding="utf-8")
        self._write_uci({})
'''
          if old not in text:
              raise SystemExit("GuardAppTests setUp anchor not found")
          text = text.replace(old, new, 1)

          old = '''            "FETCH_FAKE_LOG": str(self.fetch_log),
            "GUARD_POLICY_FILE": str(POLICY),
'''
          new = '''            "FETCH_FAKE_LOG": str(self.fetch_log),
            "GUARD_TRUSTED_RELEASE_KEY": str(self.trusted_release_key),
            "GUARD_POLICY_FILE": str(POLICY),
'''
          if old not in text:
              raise SystemExit("GuardAppTests env anchor not found")
          text = text.replace(old, new, 1)

          old = '''    def artifact_path(self, role: str) -> str:
        return DISTRIBUTION.artifact(role).path

    def published_guard_fetch_map(self) -> dict[str, dict[str, str]]:
        result: dict[str, dict[str, str]] = {}
        for artifact in DISTRIBUTION.artifacts:
            path = ROOT / artifact.path
            if path.is_file():
                result[self.distribution_url("github-raw", artifact.path)] = {
                    "body": path.read_text(encoding="utf-8")
                }
        return result
'''
          new = '''    def artifact_path(self, role: str) -> str:
        return DISTRIBUTION.artifact(role).path

    def signed_release_body(
        self,
        *,
        policy_body: str | None = None,
        templates_body: str | None = None,
    ) -> str:
        policy_body = policy_body if policy_body is not None else RUNTIME_POLICY.read_text(encoding="utf-8")
        templates_body = templates_body if templates_body is not None else RUNTIME_TEMPLATES.read_text(encoding="utf-8")
        bootstrap = ROOT / self.artifact_path("bootstrap-installer")
        payload = {
            "schemaVersion": 1,
            "sequence": 1,
            "revision": "test-release",
            "artifacts": {
                "guardBundle": {
                    "path": self.artifact_path("guard-bundle"),
                    "sha256": hashlib.sha256(BUNDLE.read_bytes()).hexdigest(),
                },
                "bootstrapInstaller": {
                    "path": self.artifact_path("bootstrap-installer"),
                    "sha256": hashlib.sha256(bootstrap.read_bytes()).hexdigest(),
                },
                "runtimePolicy": {
                    "path": self.artifact_path("runtime-policy"),
                    "sha256": hashlib.sha256(policy_body.encode()).hexdigest(),
                },
                "runtimeTemplates": {
                    "path": self.artifact_path("runtime-templates"),
                    "sha256": hashlib.sha256(templates_body.encode()).hexdigest(),
                },
            },
        }
        return json.dumps(payload, sort_keys=True) + "\\n"

    def add_signed_release_fetches(
        self,
        mapping: dict[str, dict[str, str]],
        *,
        policy_body: str | None = None,
        templates_body: str | None = None,
    ) -> dict[str, dict[str, str]]:
        mapping[self.distribution_url("github-raw", DISTRIBUTION.release_metadata_path)] = {
            "body": self.signed_release_body(policy_body=policy_body, templates_body=templates_body)
        }
        mapping[self.distribution_url("github-raw", DISTRIBUTION.release_signature_path)] = {
            "body": "test detached signature\\n"
        }
        return mapping

    def published_guard_fetch_map(self) -> dict[str, dict[str, str]]:
        result: dict[str, dict[str, str]] = {}
        for artifact in DISTRIBUTION.artifacts:
            path = ROOT / artifact.path
            if path.is_file():
                result[self.distribution_url("github-raw", artifact.path)] = {
                    "body": path.read_text(encoding="utf-8")
                }
        return self.add_signed_release_fetches(result)
'''
          if old not in text:
              raise SystemExit("published fetch map anchor not found")
          text = text.replace(old, new, 1)

          old = '''        mapping[self.distribution_url("github-raw", self.artifact_path("runtime-policy"))] = {
            "body": POLICY.read_text(encoding="utf-8")
        }
        self.fetch_map.write_text(json.dumps(mapping) + "\\n", encoding="utf-8")
'''
          new = '''        mapping[self.distribution_url("github-raw", self.artifact_path("runtime-policy"))] = {
            "body": POLICY.read_text(encoding="utf-8")
        }
        self.add_signed_release_fetches(mapping, policy_body=POLICY.read_text(encoding="utf-8"))
        self.fetch_map.write_text(json.dumps(mapping) + "\\n", encoding="utf-8")
'''
          if old not in text:
              raise SystemExit("piped setup mapping anchor not found")
          text = text.replace(old, new, 1)

          old = '''        self.fetch_map.write_text(
            json.dumps({
                raw_url: {"body": POLICY.read_text(encoding="utf-8")},
                templates_url: {"body": (ROOT / "cfg/runtime/openclash-guard-templates.json").read_text(encoding="utf-8")},
            }) + "\\n",
            encoding="utf-8",
        )
        result = self.run_guard_tty(
            "1\\ny\\nn\\n0\\n",
'''
          new = '''        mapping = self.published_guard_fetch_map()
        mapping[raw_url] = {"body": POLICY.read_text(encoding="utf-8")}
        mapping[templates_url] = {"body": (ROOT / "cfg/runtime/openclash-guard-templates.json").read_text(encoding="utf-8")}
        self.add_signed_release_fetches(mapping, policy_body=POLICY.read_text(encoding="utf-8"))
        self.fetch_map.write_text(json.dumps(mapping) + "\\n", encoding="utf-8")
        result = self.run_guard_tty(
            "1\\ny\\nn\\n0\\n",
'''
          if old not in text:
              raise SystemExit("fresh setup mapping anchor not found")
          text = text.replace(old, new, 1)

          old = '''        self.fetch_map.write_text(
            json.dumps({
                raw_url: {"body": POLICY.read_text(encoding="utf-8")},
                templates_url: {"body": (ROOT / "cfg/runtime/openclash-guard-templates.json").read_text(encoding="utf-8")},
            }) + "\\n",
            encoding="utf-8",
        )
        result = self.run_guard(
            "refresh",
'''
          new = '''        mapping = {
            raw_url: {"body": POLICY.read_text(encoding="utf-8")},
            templates_url: {"body": (ROOT / "cfg/runtime/openclash-guard-templates.json").read_text(encoding="utf-8")},
        }
        self.add_signed_release_fetches(mapping, policy_body=POLICY.read_text(encoding="utf-8"))
        self.fetch_map.write_text(json.dumps(mapping) + "\\n", encoding="utf-8")
        result = self.run_guard(
            "refresh",
'''
          if old not in text:
              raise SystemExit("fresh refresh mapping anchor not found")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Run focused release trust regressions
        run: python3 -m unittest tests.test_openclash_guard_release_trust -v

      - name: Generate deterministic outputs
        run: make generate

      - name: Run generated projection regressions
        run: |
          python3 -m unittest tests.test_openclash_guard_release_trust -v
          PYTHONPATH=internal/python python3 -m unittest tests.test_distribution_manifest -v

      - name: Run repository checks
        run: make check-all

      - name: Validate generated outputs
        run: python3 internal/python/validate_generated_profiles.py

      - name: Assert no generated remote pipe-to-shell guidance
        run: "! grep -R -nE 'curl[^|]*\\|[[:space:]]*(/bin/)?sh([[:space:]]|$)' README.md docs/openclash-guard.md setup/openclash/install.sh"

      - name: Commit candidate and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t managed_paths < <(./rulesctl managed-paths)
          git add -A -- "${managed_paths[@]}" \
            internal/config/ai-routing/catalogs/distribution.json \
            internal/python/ai_profiles/distribution.py \
            internal/python/generate_distribution_bootstrap.py \
            shell/apps/openclash-guard/install.sh \
            shell/apps/openclash-guard/main.sh \
            shell/apps/openclash-guard/preflight.sh \
            shell/lib/distribution.sh \
            shell/manifest.json \
            setup/openclash/install.sh \
            tests/test_distribution_manifest.py \
            tests/test_openclash_guard.py \
            tests/test_openclash_guard_release_trust.py
          git rm .github/workflows/tmp-signed-release-build.yml internal/python/tmp_patch_signed_release.py
          git commit -m "hardening(openclash-guard): require signed release metadata"
          git push origin HEAD:hardening/openclash-guard-signed-release
