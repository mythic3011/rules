name: PR54 gaming policy verifier

on:
  push:
    branches:
      - automation/pr54-gaming-policy

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/pr54-gaming-policy
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - run: uv pip install --system -r requirements-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply gaming policy patch
        run: python3 tools/pr54_gaming_policy_temp.py
      - name: Generate deterministic outputs
        run: make generate
      - name: Focused runtime tests
        run: python3 -m unittest tests.test_openclash_guard_runtime tests.test_openclash_guard_dataplane tests.test_openclash_guard_gaming_contract
      - name: Commit candidate locally
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(openclash-guard): encode gaming direct port ranges [skip ci]'
      - name: Full CI on committed candidate
        run: make ci
      - name: Push verified result
        run: git push origin HEAD:automation/pr54-gaming-policy
