name: Check bootstrap alias publication

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          install: false

      - name: Install pinned toolchain
        run: mise install

      - name: Verify published bootstrap alias
        run: make check-bootstrap-alias
