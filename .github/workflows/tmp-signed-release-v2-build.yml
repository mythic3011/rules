name: Temporary signed release v2 candidate build

on:
  push:
    branches:
      - hardening/openclash-guard-signed-release
    paths:
      - .github/workflows/tmp-signed-release-v2-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v6
        with:
          ref: hardening/openclash-guard-signed-release
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Apply signed release v2 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/tmp_patch_signed_release_v2.py')
          text = path.read_text()

          test_start = text.index('# Regression coverage for anti-rollback, deterministic metadata, and local integrity.')
          test_end = text.index('# Extend catalog regressions for release metadata management.', test_start)
          block = text[test_start:test_end]
          block = block.replace("    r'''\n", '    r"""\n', 1)
          tail = "    ''',\n)\n\n\n"
          if tail not in block:
              raise SystemExit('temporary test literal closing anchor not found')
          block = block.replace(tail, '    """,\n)\n\n\n', 1)
          text = text[:test_start] + block + text[test_end:]

          patch_start = text.index('if \'! check_release_state "$TMP.release"\' not in text:\n')
          patch_end = text.index('path.write_text(text, encoding="utf-8")\n', patch_start)
          robust = '''if '! check_release_state "$TMP.release"' not in text:\n    needle = '       ! verify_release "$TMP.release" "$TMP.release.sig"; then'\n    replacement = '       ! verify_release "$TMP.release" "$TMP.release.sig" || \\\\n       ! check_release_state "$TMP.release"; then'\n    if needle not in text:\n        raise SystemExit("bootstrap release verification anchor not found")\n    text = text.replace(needle, replacement, 1)\n'''
          text = text[:patch_start] + robust + text[patch_end:]
          path.write_text(text)
          PY
          python3 -m py_compile tools/tmp_patch_signed_release_v2.py
          python3 tools/tmp_patch_signed_release_v2.py

          # The temporary generator body is indented one level so that it can
          # coexist with an embedded shell heredoc. Remove exactly that outer
          # level from generated Python source, leaving relative indentation
          # and shell-string contents unchanged.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_openclash_guard_release_state.py')
          lines = path.read_text().splitlines(keepends=True)
          path.write_text(''.join(line[4:] if line.startswith('    ') else line for line in lines))
          PY
          python3 -m py_compile tests/test_openclash_guard_release_state.py

      - name: Generate deterministic outputs including release metadata
        run: make generate

      - name: Run focused release trust regressions
        run: |
          python3 -m unittest tests.test_openclash_guard_release_trust -v
          python3 -m unittest tests.test_openclash_guard_release_state -v
          python3 -m unittest tests.test_distribution_manifest -v

      - name: Run repository checks
        run: make check-all

      - name: Validate generated outputs
        run: python3 internal/python/validate_generated_profiles.py

      - name: Confirm generation never fabricates a signature
        run: |
          test -s dist/openclash-guard.release.json
          test ! -e dist/openclash-guard.release.json.sig

      - name: Commit candidate and remove temporary helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t managed_paths < <(./rulesctl managed-paths)
          git add -A -- "${managed_paths[@]}" \
            internal/config/ai-routing/catalogs/distribution.json \
            internal/config/rulesctl.json \
            internal/python/ai_profiles/distribution.py \
            internal/python/generate_distribution_bootstrap.py \
            internal/python/generate_openclash_guard_release.py \
            shell/apps/openclash-guard/install.sh \
            shell/apps/openclash-guard/main.sh \
            shell/lib/distribution.sh \
            tests/test_distribution_manifest.py \
            tests/test_openclash_guard_release_state.py
          git rm .github/workflows/tmp-signed-release-v2-build.yml tools/tmp_patch_signed_release_v2.py
          if ! git diff --cached --quiet; then
            git commit -m "hardening(openclash-guard): add anti-rollback release receipts"
            git push origin HEAD:hardening/openclash-guard-signed-release
          fi
